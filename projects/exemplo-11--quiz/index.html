<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Test your JavaScript knowledge with this interactive quiz. Answer questions, track your progress, and see your final score.">
  <title>Quiz JavaScript</title>
  <link rel="canonical" href="https://showcase-theta-opal.vercel.app/projects/exemplo-11--quiz/">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://showcase-theta-opal.vercel.app/projects/exemplo-11--quiz/">
  <meta property="og:title" content="Quiz JavaScript">
  <meta property="og:description" content="Test your JavaScript knowledge with this interactive quiz. Answer questions, track your progress, and see your final score.">
  <meta property="og:image" content="https://showcase-theta-opal.vercel.app/projects/exemplo-11--quiz/preview.png">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Showcase">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quiz JavaScript">
  <meta name="twitter:description" content="Test your JavaScript knowledge with this interactive quiz.">
  <meta name="twitter:image" content="https://showcase-theta-opal.vercel.app/projects/exemplo-11--quiz/preview.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="quiz-container">
    <header class="quiz-header">
      <h1>Quiz JavaScript</h1>
      <button class="reset-btn" onclick="restartQuiz()">Reset</button>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">1 / 10</div>
    </header>

    <main class="quiz-content" id="quizContent">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
    </main>

    <div class="result" id="result" style="display: none;">
      <h2>Resultado Final</h2>
      <p class="score" id="score"></p>
      <p class="message" id="message"></p>
      <button onclick="restartQuiz()">Refazer Quiz</button>
    </div>
  </div>

  <script src="./js/script.js"></script>
</body>
</html>
