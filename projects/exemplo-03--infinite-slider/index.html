<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="./css/style.css" />
		<title id="page-title">Carregando...</title>
	</head>
	<body>
		<header class="header" role="banner">
			<h1 class="header__title" id="page-heading"></h1>
			<div class="header__description">
				<p id="page-description"></p>
			</div>
		</header>

		<main class="main" role="main">
			<div class="slider">
				<div class="slider__container" id="slides-container"></div>
				<div class="slider__vignette" aria-hidden="true"></div>
				<div class="slider__hint">Use o scroll / swipe para navegar (infinito)</div>
				<div class="slider__resume">
					<div class="slider__resume-icon">
						<img id="resume-image" src="" alt="" />
						<p id="resume-stars"></p>
					</div>
					<div class="slider__resume-content">
						<span id="resume-obs"></span>
					</div>
				</div>
			</div>
		</main>

		<span class="sr-only" id="status" role="status" aria-live="polite" aria-atomic="true"></span>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
		<script src="./js/script.js" defer></script>
	</body>
</html>
