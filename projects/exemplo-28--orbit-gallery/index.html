<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="description" content="Orbit — a monochromatic gallery. Images drift to position, orbit the screen, then settle on random spots; hovering reveals each title in the bottom bar." />
  <link rel="canonical" href="https://showcase-theta-opal.vercel.app/projects/exemplo-28--orbit-gallery/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://showcase-theta-opal.vercel.app/projects/exemplo-28--orbit-gallery/" />
  <meta property="og:title" content="Orbit — Monochromatic Gallery" />
  <meta property="og:description" content="Images drift to position, orbit the screen, then settle on random spots; hovering reveals each title in the bottom bar." />
  <meta property="og:image" content="https://showcase-theta-opal.vercel.app/projects/exemplo-28--orbit-gallery/preview.png" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Showcase" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Orbit — Monochromatic Gallery" />
  <meta name="twitter:description" content="Monochromatic gallery with orbit motion and titles on hover." />
  <meta name="twitter:image" content="https://showcase-theta-opal.vercel.app/projects/exemplo-28--orbit-gallery/preview.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />

  <title>Orbit — Monochromatic Gallery</title>
</head>

<body>

  <!-- Loader -->
  <div class="loader" id="loader" role="status" aria-live="polite" aria-label="Loading gallery">
    <p class="loader__percent" id="loaderPercent">000</p>
    <p class="loader__label" id="loaderLabel">orbit · mono gallery</p>
    <div class="loader__track" aria-hidden="true">
      <span class="loader__fill" id="loaderFill"></span>
    </div>
  </div>

  <!-- Stage -->
  <main class="stage" id="stage" aria-label="Gallery of orbiting images">
    <header class="stage__topbar">
      <h1 class="stage__wordmark">ORBIT<span class="stage__dot">.</span></h1>
      <a class="stage__back" href="../../index.html">← BACK TO SHOWCASE</a>
    </header>

    <p class="stage__hint" id="hint" aria-hidden="true">hover the images</p>

    <div class="gallery" id="gallery" aria-hidden="true"></div>

    <span class="stage__vignette" aria-hidden="true"></span>
  </main>

  <!-- Title bar -->
  <footer class="title-bar" id="titleBar" aria-live="polite">
    <span class="title-bar__index" id="titleIndex">00</span>
    <h2 class="title-bar__title" id="titleText">HOVER</h2>
    <span class="title-bar__cue">hover</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./js/script.js?v=4"></script>
</body>
</html>
